name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Check shell scripts
        run: bash -n scripts/*.sh
